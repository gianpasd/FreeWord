[package]
name = "freeword"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3"
base64 = "0.23"
chrono = "0.4"
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
krilla = "0.8"
quick-xml = "0.42"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "9"

[profile.release]
strip = true
lto = "thin"
